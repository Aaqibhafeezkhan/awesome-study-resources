# Config for the dead-link-check workflow (.github/workflows/dead-link-check.yml).
# base_url: SECURITY.md links back to this repo with a relative "../../issues/new/choose"
# (the GitHub community-health-file convention). Without a base, lychee resolves that as a
# local filesystem path (which never exists) instead of a GitHub URL. Setting base_url makes
# it resolve the way it actually renders on GitHub.
base_url = "https://github.com/StudentSuite/awesome-study-resources/blob/main/"
# Several legitimate, working sites in README.md (getrevising.co.uk, leetcode.com,
# mitpress.mit.edu, nailib.com, quizlet.com, smarthistory.org, feynmanlectures.caltech.edu,
# ibdocuments.com, kaptest.com, sparknotes.com, ...) reject automated / non-browser requests
# with a 403 even though they're fine in a real browser.
# Accepting 403 avoids constant false-positive noise; a truly dead entry usually surfaces
# as a timeout, DNS failure, TLS error, or 404/410 instead, all of which still fail the check.
# 202 is also accepted: global.oup.com returns it for a valid, working product page.
# 405 is also accepted: clastify.com intermittently rejects the automated request method
# (HEAD) with a 405 even though the same URL returns 200 over GET in a real browser.
accept = [200, 202, 206, 403, 405, 429]

max_concurrency = 8
timeout = 20
retry_wait_time = 2
max_retries = 2

user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# hyperphysics.phy-astr.gsu.edu (By Subject > Physics) is intentionally linked over plain
# http://, not a bug to "fix" into https://. Manually verified with curl: the https:// host
# fails the TLS handshake outright (curl error, no response at all), while http:// returns a
# clean 200. Leave it on http:// unless the server starts serving valid TLS.

# cambridgeincolour.com (By Subject > Photography) intermittently times out for lychee (#292
# and prior runs). Manually verified: the TCP connection to port 443 succeeds instantly (and
# plain http:// also responds, with a 301 to https://), but the TLS handshake itself hangs
# and times out for automated clients (curl, Python's ssl module, this workflow's fetcher)
# regardless of certificate verification, while the site is still indexed and served normally
# to real browsers/search bots. That's consistent with TLS-fingerprint-based bot blocking, not
# a dead site, so it's excluded here instead of removed from README.md.
# sacred-texts.com (By Subject > Religious Studies / Classics), oranoai.com (Notes & Knowledge
# Management) and siriusrevision.com (Exam & Curriculum Prep > IB) are live sites that respond
# 200 to curl and browsers with this same user agent, but fail only from the CI runner (#394):
# sacred-texts.com triggers an HTTP/2 protocol error in lychee's client, oranoai.com returns a
# bogus 404 to GitHub-hosted runner IPs, and siriusrevision.com times out intermittently. These
# are bot/IP-blocking and client quirks, not dead sites, so they are excluded instead of removed.
# tutorial.math.lamar.edu (By Subject > Mathematics, Paul's Online Math Notes) is a long-running,
# actively maintained site (copyright 2026), but as of 2026-10-17 Lamar University's DNS publishes
# its CNAME (tutorial-math.wip.lamar.edu) with no address record behind it, so every resolver fails
# (curl exit 6). That looks like a university-side DNS/hosting outage, not a retired resource, so it
# is excluded instead of removed; drop this exclusion once the site resolves again.
exclude = [
  "https://www.cambridgeincolour.com/",
  "https://sacred-texts.com/",
  "https://oranoai.com/",
  "https://www.siriusrevision.com/",
  "https://tutorial.math.lamar.edu/",
]
