name: Test

on:
  # No `paths:` filter here: main's branch protection requires this check, and a
  # path-skipped workflow never reports a status, which blocks the merge button.
  pull_request:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - .github/workflows/test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node --test scripts/*.test.mjs
