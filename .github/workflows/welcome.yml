name: Welcome First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            Thanks for opening your first issue here! If you're suggesting a resource,
            reporting a broken link, or proposing a new section, a maintainer will take
            a look soon. For anything more open-ended,
            [Discussions](https://github.com/StudentSuite/awesome-study-resources/discussions)
            is also a good place to ask. See
            [CONTRIBUTING.md](https://github.com/StudentSuite/awesome-study-resources/blob/main/CONTRIBUTING.md)
            for how this list is maintained.
          pr_message: >
            Thanks for your first PR! Add one record per resource to
            `data/resources.json`, then regenerate `README.md` with
            `node scripts/generate-readme.mjs`; do not edit `README.md` by hand.
            Follow the
            [Entry format section of CONTRIBUTING.md](https://github.com/StudentSuite/awesome-study-resources/blob/main/CONTRIBUTING.md#entry-format)
            and run the four local checks listed in
            [CI checks](https://github.com/StudentSuite/awesome-study-resources/blob/main/CONTRIBUTING.md#ci-checks).
            Also make sure each resource meets the
            [Quality Standards](https://github.com/StudentSuite/awesome-study-resources/blob/main/README.md#quality-standards)
            (real, maintained, reputable, with pricing noted).
